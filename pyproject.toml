[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mn-phosphor-ml"
version = "0.1.0"
description = "Public demo for literature metadata, composition features, and regression baselines for Mn-based phosphors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mn Phosphor ML Contributors" }
]
dependencies = [
  "numpy>=1.24.0",
  "python-dotenv>=1.0.0",
  "scikit-learn>=1.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
ml = [
  "xgboost>=2.0.0",
]
descriptors = [
  "matminer>=0.9.0",
  "pymatgen>=2024.0.0",
]
xgboost = [
  "xgboost>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
